# Enchantment types are like categories.
# They have a color that shows in lore, they have an optional limit
# as to how many of a certain type can be on any item, et cetera.

types:
  - id: normal # The ID of the type
    format: "&7" # The format of enchantments of this type in display
    limit: -1 # The maximum amount of enchants of this type on an item (-1 to disable)
    high-level-bias: 0 # The bias against getting high levels of enchants with this type. Between 0-1, 0 is no bias, 1 is only level 1 from enchanting tables and villagers (loot still gives higher levels, just less often).
    max-loot-level: -1 # The highest level enchants of this type can get from loot: chests, fishing, mob drops and raids (-1 to disable)
    no-grindstone: false # If enchants of this type should not be removable in the grindstone

  - id: curse
    format: "&c"
    limit: -1
    high-level-bias: 0
    max-loot-level: -1
    no-grindstone: true

  - id: spell
    format: "<gradient:#0575E6:#1E3FBA>"
    limit: 1
    high-level-bias: 0.5
    max-loot-level: -1
    no-grindstone: false

  - id: special
    format: "<gradient:#FB57EC:#EF1DEC>"
    limit: 1
    high-level-bias: 0.7
    max-loot-level: -1
    no-grindstone: false
