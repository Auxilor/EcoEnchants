display-name: "Repairing"
description: "Automatically gain &a%amount%&r durability every &a%frequency% &rseconds"
type: special
placeholders:
  frequency: "1.5"
  amount: "%level%"

targets:
  - all
conflicts:
  - mending
rarity: veryspecial
max-level: 3

tradeable: true
discoverable: true
enchantable: true

effects:
  - id: repair_item
    args:
      damage: "%level%"
    triggers:
      - static_30
    conditions:
      - id: provider_in_slot # Don't repair items while they are held or worn
        args:
          slots:
            - hands
            - armor
          inverse: true

conditions: [ ]
